name: Generate snake game

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *" # Ajustado: o asterisco inicial executava a cada minuto da hora 12. Agora executa estritamente a cada 12h.
  workflow_dispatch:

# ADICIONE ESTE BLOCO AQUI EMBAIXO:
permissions:
  contents: write

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      # Clone do repositório necessário para gerar a pasta dist corretamente
      - uses: actions/checkout@v3

      # Snake Animation
      - uses: Sutil/snk@master
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          svg_out_path: dist/github-contribution-grid-snake2.svg
          snake_color: 'blue'

      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
